name: Site checks

# Quality checks that are safe to run in public. Checks for confidential
# content run locally before a push (see scripts/check_publish.py): by the
# time CI runs on a public repo, the content is already public.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"   # Mondays: catch links that have stopped working
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish guard tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
          python3 -m unittest discover -s tests -v

      - name: Local resources, alt text, structure and contrast
        run: python3 scripts/check_site.py

      - name: HTML validation
        run: npx --yes html-validate@11.16.2 index.html

      - name: Accessibility (WCAG 2 AA)
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          sleep 2
          npx --yes pa11y-ci@4.1.1 --config .pa11yci.json

      - name: Links
        uses: lycheeverse/lychee-action@v2
        with:
          # Many sites (Scholar, X, JAMA, Science) answer bots with 403 or 429:
          # the page exists, the checker is refused. Accept those, so only dead
          # links (404, 5xx, DNS) fail. LinkedIn answers bots with a
          # non-standard 999, so it is skipped.
          args: >-
            --no-progress --max-retries 2
            --accept '100..=103,200..=299,403,429'
            --exclude 'linkedin\.com'
            index.html llms.txt
          fail: true
